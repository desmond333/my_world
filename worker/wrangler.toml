name = "tau-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = true

[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "*"
FRONTEND_ORIGIN = "https://your-domain.pages.dev"
ADMIN_EMAIL = "your@email.com"

[[d1_databases]]
binding = "DB"
database_name = "tau-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
