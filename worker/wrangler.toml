name = "tau-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = true

[observability]
enabled = true

[vars]
# Локальная разработка: "*" разрешает любой источник. В продакшене укажите конкретные домены через запятую.
ALLOWED_ORIGIN = "*"
# Адрес фронтенда (для CORS/cookie). Замените перед деплоем.
FRONTEND_ORIGIN = "https://your-domain.pages.dev"
# Email администратора. Оставьте пустым в репозитории; задайте перед деплоем
# через секрет (wrangler secret put ADMIN_EMAIL) или в локальном .dev.vars.
ADMIN_EMAIL = ""
# development для локальной работы; перед деплоем поменяйте на production.
# В production обязателен секрет JWT_SECRET (wrangler secret put JWT_SECRET),
# иначе авторизация вернёт 500 SERVER_MISCONFIGURED.
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "tau-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
